<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Môj zoznam">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Môj zoznam</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; padding: 24px 16px; }
    .app { width: 100%; max-width: 520px; }
    h1 { margin: 12px 0 4px; font-size: 32px; }
    .subtitle { margin: 0 0 24px; color: #94a3b8; }
    .add-row { display: flex; gap: 10px; }
    input { flex: 1; min-width: 0; border: 1px solid #334155; border-radius: 14px; padding: 14px 16px; font-size: 17px; background: #1e293b; color: #fff; outline: none; }
    input:focus { border-color: #60a5fa; }
    button { border: 0; border-radius: 14px; padding: 12px 16px; font-size: 16px; font-weight: 700; cursor: pointer; }
    #addButton { background: #2563eb; color: white; }
    #clearButton { width: 100%; margin-top: 18px; background: #1e293b; color: #cbd5e1; }
    ul { list-style: none; padding: 0; margin: 22px 0 0; display: grid; gap: 10px; }
    li { display: flex; align-items: center; gap: 12px; padding: 14px 14px 14px 16px; background: #1e293b; border: 1px solid #334155; border-radius: 16px; }
    .item-text { flex: 1; overflow-wrap: anywhere; }
    .delete { background: #7f1d1d; color: #fecaca; padding: 9px 12px; }
    .empty { text-align: center; color: #64748b; padding: 32px 8px; border: 1px dashed #334155; border-radius: 16px; }
    .counter { margin-top: 14px; color: #94a3b8; font-size: 14px; }
  </style>
</head>
<body>
  <main class="app">
    <h1>Môj zoznam</h1>
    <p class="subtitle">Pridávaj a odoberaj položky. Zoznam sa uloží v zariadení.</p>

    <div class="add-row">
      <input id="itemInput" type="text" placeholder="Napr. kúpiť mlieko" autocomplete="off" maxlength="120">
      <button id="addButton" type="button">Pridať</button>
    </div>

    <div id="counter" class="counter"></div>
    <ul id="list"></ul>
    <button id="clearButton" type="button">Vymazať celý zoznam</button>
  </main>

  <script>
    const STORAGE_KEY = 'iphone-zoznam-items-v1';
    const input = document.getElementById('itemInput');
    const list = document.getElementById('list');
    const counter = document.getElementById('counter');
    const addButton = document.getElementById('addButton');
    const clearButton = document.getElementById('clearButton');

    let items = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function render() {
      list.innerHTML = '';
      counter.textContent = `Počet položiek: ${items.length}`;
      clearButton.hidden = items.length === 0;

      if (items.length === 0) {
        const empty = document.createElement('li');
        empty.className = 'empty';
        empty.textContent = 'Zoznam je zatiaľ prázdny.';
        list.appendChild(empty);
        return;
      }

      items.forEach((item, index) => {
        const li = document.createElement('li');
        const text = document.createElement('span');
        text.className = 'item-text';
        text.textContent = item;

        const remove = document.createElement('button');
        remove.className = 'delete';
        remove.type = 'button';
        remove.textContent = 'Odobrať';
        remove.addEventListener('click', () => {
          items.splice(index, 1);
          save();
          render();
        });

        li.append(text, remove);
        list.appendChild(li);
      });
    }

    function addItem() {
      const value = input.value.trim();
      if (!value) return;
      items.push(value);
      input.value = '';
      save();
      render();
      input.focus();
    }

    addButton.addEventListener('click', addItem);
    input.addEventListener('keydown', event => {
      if (event.key === 'Enter') addItem();
    });

    clearButton.addEventListener('click', () => {
      if (confirm('Naozaj chceš vymazať celý zoznam?')) {
        items = [];
        save();
        render();
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js'));
    }

    render();
  </script>
</body>
</html>
